<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KARE ECE | Syllabus Build Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;  /* Green - Synchronized */
            --info: #3b82f6;     /* Blue - Local Fresh */
            --warning: #f59e0b;  /* Orange - Outdated */
            --danger: #ef4444;   /* Red - Missing */
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #334155;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #334155;
        }

        .stat-value { font-size: 1.2rem; font-weight: bold; color: var(--info); display: block; }
        .stat-label { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .view-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #334155;
            position: relative;
            transition: transform 0.2s;
        }

        .view-card:hover { transform: translateY(-3px); }

        /* Status Border colors */
        .status-SYNCHRONIZED { border-left: 6px solid var(--success); }
        .status-JUST_GENERATED { border-left: 6px solid var(--info); }
        .status-OUTDATED_SOURCE { border-left: 6px solid var(--warning); }
        .status-MISSING { border-left: 6px solid var(--danger); }

        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .view-title { font-size: 1.1rem; font-weight: 800; }

        .badge {
            font-size: 0.7rem;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-weight: bold;
        }

        .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-info { background: rgba(59, 130, 246, 0.2); color: var(--info); }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .hash-group {
            background: #0f172a;
            padding: 0.8rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.75rem;
            margin: 1rem 0;
        }

        .hash-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .hash-label { color: var(--text-dim); }

        .download-link {
            display: block;
            text-align: center;
            background: var(--info);
            color: white;
            text-decoration: none;
            padding: 0.6rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .download-link:hover { opacity: 0.9; }
        .disabled-link { background: #334155; cursor: not-allowed; opacity: 0.5; }

        footer {
            margin-top: 4rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Syllabus Build Dashboard</h1>
        <p style="color: var(--text-dim)">Jeya prakash, here is your real-time build integrity report.</p>
    </header>

    <div class="stats-summary">
        <div class="stat-card">
            <span class="stat-value" id="repo-hash">---</span>
            <span class="stat-label">Git Commit</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="build-time">---</span>
            <span class="stat-label">Dashboard Updated</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="file-ratio">0 / 0</span>
            <span class="stat-label">Ready for Release</span>
        </div>
    </div>

    <div id="view-grid" class="grid">
        </div>

    <footer>
        © 2026 KARE | Department of Electronics and Communication Engineering
    </footer>
</div>

<script>
async function refreshDashboard() {
    try {
        const response = await fetch('dashboard_data.json');
        const data = await response.json();

        // Update Header Stats
        document.getElementById('repo-hash').innerText = data.current_commit;
        document.getElementById('build-time').innerText = new Date(data.generated_at).toLocaleTimeString();
        
        const readyCount = data.views.filter(v => v.sync_status === "SYNCHRONIZED" || v.sync_status === "JUST_GENERATED").length;
        document.getElementById('file-ratio').innerText = `${readyCount} / ${data.views.length}`;

        let html = "";
        data.views.forEach(view => {
            let statusClass = "status-" + view.sync_status;
            let badgeClass = "badge-danger";
            let friendlyStatus = view.sync_status.replace(/_/g, " ");

            // Logic to determine badge color
            if (view.sync_status === "SYNCHRONIZED") badgeClass = "badge-success";
            else if (view.sync_status === "JUST_GENERATED") {
                badgeClass = "badge-info";
                friendlyStatus = "LOCAL FRESH";
            }
            else if (view.sync_status === "OUTDATED_SOURCE") badgeClass = "badge-warning";

            html += `
                <div class="view-card ${statusClass}">
                    <div class="view-header">
                        <span class="view-title">${view.view.toUpperCase()}</span>
                        <span class="badge ${badgeClass}">${friendlyStatus}</span>
                    </div>

                    <div class="hash-group">
                        <div class="hash-row">
                            <span class="hash-label">Live Hash:</span>
                            <span>${view.live_hash ? view.live_hash.substring(0,8) : '--------'}</span>
                        </div>
                        <div class="hash-row">
                            <span class="hash-label">Git Hash:</span>
                            <span>${view.last_commit_hash ? view.last_commit_hash.substring(0,8) : '--------'}</span>
                        </div>
                    </div>

                    <div style="font-size: 0.75rem; margin-bottom: 1rem;">
                        <span style="color: var(--text-dim)">Modified:</span> 
                        ${view.last_modified ? new Date(view.last_modified).toLocaleString() : 'N/A'}
                    </div>

                    ${view.status === "GENERATED" ? 
                        `<a href="../${view.file}" class="download-link" target="_blank">View Document</a>` :
                        `<a href="#" class="download-link disabled-link">Build Missing</a>`
                    }
                </div>
            `;
        });

        document.getElementById('view-grid').innerHTML = html;

    } catch (e) {
        document.getElementById('view-grid').innerHTML = `<p style="color: var(--danger)">Dashboard data not found. Run main.py first.</p>`;
    }
}

window.onload = refreshDashboard;
</script>
</body>
</html>
