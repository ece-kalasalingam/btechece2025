<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KARE ECE | Syllabus Integrity Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --accent: #3b82f6;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 3rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 2rem;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.25rem;
            border-radius: 0.75rem;
            text-align: center;
            border: 1px solid #334155;
        }

        .stat-value { font-size: 1.5rem; font-weight: bold; color: var(--accent); display: block; }
        .stat-label { font-size: 0.875rem; color: var(--text-dim); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .view-card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid #334155;
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
        }

        .view-card:hover { transform: translateY(-4px); }

        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .view-title { font-size: 1.125rem; font-weight: 700; color: var(--text-main); }

        .badge {
            font-size: 0.7rem;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-success { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .badge-warning { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .badge-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        .hash-box {
            background: #0f172a;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.8rem;
            margin: 1rem 0;
            border: 1px solid #334155;
        }

        .hash-line { display: flex; justify-content: space-between; margin-bottom: 0.25rem; }
        .hash-label { color: var(--text-dim); }
        .hash-value { color: var(--accent); }

        .btn-group { display: flex; gap: 0.5rem; margin-top: 1rem; }

        .btn {
            flex: 1;
            text-align: center;
            padding: 0.6rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-disabled { background: #334155; color: var(--text-dim); cursor: not-allowed; }
        .btn:hover:not(.btn-disabled) { opacity: 0.9; }

        footer {
            margin-top: 4rem;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Syllabus Build Dashboard</h1>
        <p style="color: var(--text-dim)">KARE ECE Automated Verification System</p>
    </header>

    <div class="stats-summary">
        <div class="stat-card">
            <span class="stat-value" id="current-commit">------</span>
            <span class="stat-label">Project HEAD Hash</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="build-time">--:--</span>
            <span class="stat-label">Last Pipeline Run (UTC)</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="sync-count">0/0</span>
            <span class="stat-label">Files Synchronized</span>
        </div>
    </div>

    <div id="view-grid" class="grid">
        </div>

    <footer>
        © 2026 Department of ECE | KARE | Generated via GitHub Actions
    </footer>
</div>

<script>
async function loadData() {
    try {
        const response = await fetch('dashboard_data.json');
        const data = await response.json();

        // Update Stats
        document.getElementById('current-commit').innerText = data.current_commit;
        document.getElementById('build-time').innerText = data.generated_at.split('T')[1].substring(0, 5);
        
        const syncCount = data.views.filter(v => v.sync_status === "SYNCHRONIZED").length;
        document.getElementById('sync-count').innerText = `${syncCount} / ${data.views.length}`;

        let gridHtml = "";
        data.views.forEach(view => {
            const isGenerated = view.status === "GENERATED";
            let badgeClass = "badge-danger";
            let statusText = view.sync_status || "MISSING";

            if (view.sync_status === "SYNCHRONIZED") badgeClass = "badge-success";
            else if (isGenerated) badgeClass = "badge-warning";

            gridHtml += `
                <div class="view-card">
                    <div class="view-header">
                        <div class="view-title">${view.view.toUpperCase()}</div>
                        <span class="badge ${badgeClass}">${statusText.replace('_', ' ')}</span>
                    </div>
                    
                    <div class="hash-box">
                        <div class="hash-line">
                            <span class="hash-label">Live Hash:</span>
                            <span class="hash-value">${view.live_hash || '--------'}</span>
                        </div>
                        <div class="hash-line">
                            <span class="hash-label">Git Hash:</span>
                            <span class="hash-value">${view.last_commit_hash || '--------'}</span>
                        </div>
                    </div>

                    <div class="meta" style="font-size: 0.75rem; color: var(--text-dim);">
                        Ver: ${view.version || '0'} | Modified: ${view.last_modified ? view.last_modified.split('T')[0] : 'N/A'}
                    </div>

                    <div class="btn-group">
                        ${isGenerated ? 
                            `<a href="../${view.file}" class="btn btn-primary" target="_blank">View File</a>` : 
                            `<span class="btn btn-disabled">Not Built</span>`
                        }
                    </div>
                </div>
            `;
        });

        document.getElementById('view-grid').innerHTML = gridHtml;

    } catch (e) {
        document.getElementById('view-grid').innerHTML = `<p style="color: var(--danger)">Error loading dashboard: ${e.message}</p>`;
    }
}

window.onload = loadData;
</script>
</body>
</html>
